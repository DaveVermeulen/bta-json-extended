name: Release

# Push a tag like v0.1.0 to build the mod and open a *draft* GitHub release with the jar.
# The maintainer reviews the draft and presses Publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches mod_version
        run: |
          version=$(sed -n 's/^mod_version *= *//p' bta/gradle.properties | tr -d '[:space:]')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version $version in bta/gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Core tests
        run: ./gradlew -p core test --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

      - name: Build the mod
        run: ./gradlew -p bta build --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bta/build/libs/*.jar \
            --draft \
            --title "BTA JSON Extended $VERSION" \
            --notes-file release-notes.md
